.line{stroke-dasharray:1000;animation:draw 2.4s ease-out .3s both}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.05;transform:scale(2.4)}}
</style>
